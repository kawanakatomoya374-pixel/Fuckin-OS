set timeout=3
set default=0

insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod font
if [ "$grub_platform" = "efi" ]; then
  insmod efi_gop
  insmod efi_uga
else
  insmod vbe
  insmod vga
fi

# The graphical menu uses the standard desktop mode. Each launch entry
# explicitly requests a framebuffer mode before C-OS receives gfxpayload.
set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
set gfxpayload=keep
terminal_output gfxterm

# C-OS branded theme (dark navy + accent blue, matching the boot splash and the
# rest of the desktop) - falls back to the plain gfxterm menu above if the
# theme file is missing from this particular boot medium, rather than erroring.
# theme.txt's own fonts must be loaded before `set theme` - gfxmenu does not
# load them lazily, and a menu whose font never loaded renders as an empty box.
if [ -f /boot/grub/themes/c-os/theme.txt ]; then
  loadfont /boot/grub/themes/c-os/dejavu_14.pf2
  loadfont /boot/grub/themes/c-os/dejavu_14_bold.pf2
  loadfont /boot/grub/themes/c-os/dejavu_11.pf2
  set theme=/boot/grub/themes/c-os/theme.txt
fi

menuentry "C-OS 4.0.9 Alpha (Standard 1024x768)" {
    set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "C-OS 4.0.9 Alpha (480p 640x480)" {
    set gfxmode=640x480x32,640x480,640x480x24,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "C-OS 4.0.9 Alpha (HD 1280x720)" {
    set gfxmode=1280x720x32,1280x720,1280x720x24,1024x768x32,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}
