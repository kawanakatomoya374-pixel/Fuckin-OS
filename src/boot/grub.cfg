set timeout=3
set default=0

insmod gzio          # the kernel is a gzip file: GRUB unpacks it while loading, so far less has to be read from the medium
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod font
if [ "$grub_platform" = "efi" ]; then
  insmod efi_gop
  insmod efi_uga
else
  insmod vbe
  insmod vga
fi

# The graphical menu uses the standard desktop mode. Each launch entry
# explicitly requests a framebuffer mode before C-OS receives gfxpayload.
set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
set gfxpayload=keep
terminal_output gfxterm

# C-OS branded theme (dark navy + accent blue, matching the boot splash and the
# rest of the desktop) - falls back to the plain gfxterm menu above if the
# theme file is missing from this particular boot medium, rather than erroring.
# theme.txt's own fonts must be loaded before `set theme` - gfxmenu does not
# load them lazily, and a menu whose font never loaded renders as an empty box.
if [ -f /boot/grub/themes/c-os/theme.txt ]; then
  loadfont /boot/grub/themes/c-os/dejavu_14.pf2
  loadfont /boot/grub/themes/c-os/dejavu_14_bold.pf2
  loadfont /boot/grub/themes/c-os/dejavu_11.pf2
  set theme=/boot/grub/themes/c-os/theme.txt
fi

# ---- which kernel (docs/app_update.md, kernel updates) ---------------------------------------------------------------------
# /boot/kernel.elf.gz is slot a, /boot/kernel.b.gz slot b. grubenv (on a disk: written by the kernel and by `save_env` below; on a CD there is none and slot a is used) says
#   active=a|b   the slot that normally starts
#   trial=a|b    a freshly installed kernel that has not confirmed itself yet; it is started ONCE (trial_seen=1 is saved before it starts)
# A trial kernel that confirms itself makes its slot active (the kernel does that). If the next start still finds trial_seen=1 it never confirmed itself: the trial is
# dropped (failed=<slot> is saved, the kernel notes it as a bad update) and the active slot starts. A kernel GRUB cannot even load falls through to the last entry.
insmod loadenv
set active=a
set trial=
set trial_seen=
set failed=
load_env
set kslot="${active}"
if [ -n "${trial}" ]; then
  if [ "${trial_seen}" = "1" ]; then
    set failed="${trial}"
    set trial=
    set trial_seen=
    save_env failed trial trial_seen
  else
    set trial_seen=1
    save_env trial_seen
    set kslot="${trial}"
  fi
fi
if [ "${kslot}" = "b" ]; then set kfile=/boot/kernel.b.gz; else set kfile=/boot/kernel.elf.gz; fi
if [ "${active}" = "b" ]; then set afile=/boot/kernel.b.gz; set aslot=b; else set afile=/boot/kernel.elf.gz; set aslot=a; fi
set fallback=3

menuentry "C-OS 4.1.0 (Standard 1024x768)" {
    set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
    set gfxpayload=keep
    multiboot2 ${kfile} cos_slot=${kslot}
    boot
}

menuentry "C-OS 4.1.0 (480p 640x480)" {
    set gfxmode=640x480x32,640x480,640x480x24,auto
    set gfxpayload=keep
    multiboot2 ${kfile} cos_slot=${kslot}
    boot
}

menuentry "C-OS 4.1.0 (HD 1280x720)" {
    set gfxmode=1280x720x32,1280x720,1280x720x24,1024x768x32,auto
    set gfxpayload=keep
    multiboot2 ${kfile} cos_slot=${kslot}
    boot
}

# the way back: always the active slot (menu entry 3, `fallback` above: used when the entry that was chosen could not load its kernel)
menuentry "C-OS 4.1.0 (previous kernel)" {
    set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
    set gfxpayload=keep
    multiboot2 ${afile} cos_slot=${aslot}
    boot
}
