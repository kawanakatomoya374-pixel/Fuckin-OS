<!doctype html>
<div id="target" data-old="before"></div><pre id="result">pending</pre>
<script>
(function () {
  var target = document.getElementById('target');
  var result = document.getElementById('result');
  var seen = [];
  try {
    var observer = new MutationObserver(function (records) {
      for (var i = 0; i < records.length; ++i) seen.push(records[i]);
    });
    observer.observe(target, {attributes: true, attributeOldValue: true});
    target.setAttribute('data-old', 'after');
    queueMicrotask(function () {
      var attr = seen.length ? seen[0] : null;
      var ok = attr && attr.type === 'attributes' && attr.attributeName === 'data-old' && attr.oldValue === 'before';
      result.textContent = ok ? 'PASS: attribute oldValue snapshot' : 'FAIL records=' + seen.length + ' old=' + (attr && attr.oldValue);
      console.log(ok ? 'MUTATION_ATTRIBUTE_OLDVALUE_PASS' : 'MUTATION_ATTRIBUTE_OLDVALUE_FAIL records=' + seen.length);
    });
  } catch (e) { result.textContent = 'FAIL: ' + e; console.log('MUTATION_ATTRIBUTE_OLDVALUE_FAIL ' + e); }
}());
</script>
