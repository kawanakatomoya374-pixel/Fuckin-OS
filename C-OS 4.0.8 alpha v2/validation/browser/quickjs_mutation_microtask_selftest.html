<!doctype html>
<meta charset="utf-8">
<title>QuickJS MutationObserver microtask self-test</title>
<div id="root"></div><pre id="result">pending</pre>
<script>
(function () {
  var root = document.getElementById('root');
  var result = document.getElementById('result');
  var seen = [];
  try {
    var observer = new MutationObserver(function (records) {
      seen.push(records.length > 0 && records[0].target === root);
      if (seen.length === 1 && seen[0]) {
        result.textContent = 'PASS: MutationObserver microtask';
        if (console && console.log) console.log('MUTATION_MICROTASK_PASS');
      } else {
        result.textContent = 'FAIL: MutationObserver record';
        if (console && console.log) console.log('MUTATION_MICROTASK_FAIL record');
      }
    });
    observer.observe(root, { childList: true });
    root.appendChild(document.createElement('span'));
    queueMicrotask(function () {
      if (seen.length === 0) {
        result.textContent = 'FAIL: callback not queued';
        if (console && console.log) console.log('MUTATION_MICROTASK_FAIL not-queued');
      }
    });
  } catch (e) {
    result.textContent = 'FAIL: ' + e;
    if (console && console.log) console.log('MUTATION_MICROTASK_FAIL ' + e);
  }
}());
</script>
