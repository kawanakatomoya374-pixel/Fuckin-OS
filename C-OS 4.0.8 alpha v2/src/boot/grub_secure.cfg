# C-OS UEFI Secure Boot standalone GRUB configuration.
# This file and /boot/kernel.elf are embedded inside the signed BOOTX64.EFI
# image by tools/build_secureboot_uefi.sh. Do not add an external configfile or
# a disk/ISO kernel fallback here: that would weaken the verification boundary.
set timeout=0
set default=0

insmod all_video
insmod gfxterm
insmod efi_gop
insmod efi_uga

set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
set gfxpayload=keep
terminal_output gfxterm

echo "C-OS 4.0.8 alpha Secure Boot"
multiboot2 /boot/kernel.elf
boot
