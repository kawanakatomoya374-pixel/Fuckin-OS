set timeout=3
set default=0

insmod all_video
insmod gfxterm
if [ "$grub_platform" = "efi" ]; then
  insmod efi_gop
  insmod efi_uga
else
  insmod vbe
  insmod vga
fi

# The graphical menu uses the standard desktop mode. Each launch entry
# explicitly requests a framebuffer mode before C-OS receives gfxpayload.
set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
set gfxpayload=keep
terminal_output gfxterm

menuentry "C-OS 4.0.8 alpha (Standard 1024x768)" {
    set gfxmode=1024x768x32,1024x768,1024x768x24,800x600x32,800x600,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "C-OS 4.0.8 alpha (480p 640x480)" {
    set gfxmode=640x480x32,640x480,640x480x24,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}

menuentry "C-OS 4.0.8 alpha (HD 1280x720)" {
    set gfxmode=1280x720x32,1280x720,1280x720x24,1024x768x32,auto
    set gfxpayload=keep
    multiboot2 /boot/kernel.elf
    boot
}
